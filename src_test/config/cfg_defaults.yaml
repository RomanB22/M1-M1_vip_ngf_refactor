  allowConnsWithWeight0: true
  allowSelfConns: false
  scale: 1.0
  sizeY: 1350.0
  sizeX: 300.0
  sizeZ: 300.0
  correctBorderThreshold: 150.0

  L5BrecurrentFactor: 1.0
  ITinterFactor: 1.0
