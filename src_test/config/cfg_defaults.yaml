    start: 1000
    end: 1100
    rate: 20
    noise: 0.8
  pulse2:
    pop: None
    start: 1000
    end: 1200
    rate: 20
    noise: 0.5
    duration: null

  IClamp1:
    pop: IT5B
    sec: soma
    loc: 0.5
    start: 0
    dur: 1000
    amp: 0.5

  NetStim1:
    pop: IT2
    ynorm: [0, 1]
    sec: soma
    loc: 0.5
