    '2': [0.1, 0.29]
    '4': [0.29, 0.37]
    '5A': [0.37, 0.47]
    '24': [0.1, 0.37]
    '5B': [0.47, 0.8]
    '6': [0.8, 1.0]
    longTPO: [2.0, 2.1]
    longTVL: [2.1, 2.2]
    longS1: [2.2, 2.3]
    longS2: [2.3, 2.4]
    longcM1: [2.4, 2.5]
    longM2: [2.5, 2.6]
    longOC: [2.6, 2.7]

  singleCellPops: false
  weightNorm: 1
