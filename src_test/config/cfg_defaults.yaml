  ihlkc: 0.2
  ihlkcBasal: 1.0
  ihlkcBelowSoma: 0.01
  ihlke: -86
  ihSlope: 28

  somaNa: 5
  axonNa: 7
  axonRa: 0.005
  gpas: 0.5
  epas: 0.9

  synWeightFractionEE: [0.5, 0.5]
  synWeightFractionEI: [0.5, 0.5]
  synWeightFractionSOME: [0.9, 0.1]
  synWeightFractionNGF: [0.5, 0.5]

  synsperconn:
