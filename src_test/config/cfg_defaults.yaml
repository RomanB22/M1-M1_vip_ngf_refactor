    stim: 1234
    loc: 4321
    tvl_sampling: 1234
    cell: 1234
    m1_sampling: 1234
  hParams:
    celsius: 34
    v_init: -80

  verbose: false
  createNEURONObj: true
  createPyStruct: true
  connRandomSecFromList: false
  cvode_active: false
  cvode_atol: 1.0e-6
  cache_efficient: true
  printRunTime: 0.1
  printSynsAfterRule: false
  pt3dRelativeToCellLocation: true
  oneSynPerNetcon: true
  validateNetParams: true
  progressBar: 0

  includeParamsLabel: false
  checkErrors: false
  checkErrorsVerbose: false
  rand123GlobalIndex: null
  coreneuron: true
  random123: true
  gpu: false

  recordStim: false
